<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - TravelingFeeling</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Crear cuenta</h1>

        <div id="mensajeError" class="mensaje-error"></div>

        <form id="formRegistro">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" required>
            </div>

            <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" required minlength="8">
            </div>

            <button type="submit" class="boton-principal">Registrarme</button>
        </form>

        <p class="enlace-secundario">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
