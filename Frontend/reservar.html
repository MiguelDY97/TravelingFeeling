<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar - TravelingFeeling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h1 id="tituloDestino">Reservar</h1>

        <div id="mensajeError" class="mensaje-error"></div>

        <form id="formReservar">
            <div class="campo">
                <label for="fecha_reserva">Fecha</label>
                <input type="date" id="fecha_reserva" required>
            </div>

            <div class="campo">
                <label for="cantidad_personas">Cantidad de personas</label>
                <input type="number" id="cantidad_personas" min="1" required>
            </div>

            <button type="submit" class="boton-principal">Confirmar reserva</button>
        </form>

        <p class="enlace-secundario">
            <a href="destinos.html">Volver a destinos</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/reservar.js"></script>
</body>
</html>
