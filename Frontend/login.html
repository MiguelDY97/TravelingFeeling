<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - TravelingFeeling</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Iniciar sesión</h1>

        <div id="mensajeError" class="mensaje-error"></div>

        <form id="formLogin">
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" required>
            </div>

            <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" required>
            </div>

            <button type="submit" class="boton-principal">Ingresar</button>
        </form>

        <p class="enlace-secundario">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
